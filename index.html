<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprotify</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --green: #1db954;
    --green-dark: #17a349;
    --bg: #0a0a0a;
    --sidebar: #111111;
    --card: #181818;
    --card-hover: #282828;
    --text: #ffffff;
    --muted: #b3b3b3;
    --border: #282828;
    --player-bg: #181818;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-columns: 200px 1fr; /* Utzoomad/smalare sidebar */
    grid-template-rows: 1fr 80px;      /* Mer kompakt spelare */
    overflow: hidden;
    user-select: none;
    font-size: 13px; /* Globalt mer utzoomat */
  }

  /* ── LÖSENORDSSKÄRM ── */
  #loginScreen {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  #loginScreen h1 { font-size: 28px; color: var(--green); font-weight: 700; }
  #loginScreen input {
    background: #181818; border: 1px solid var(--border); color: #fff;
    padding: 10px 16px; border-radius: 20px; width: 240px; text-align: center;
    font-size: 14px; outline: none; font-family: inherit;
  }
  #loginScreen input:focus { border-color: var(--green); }
  #loginScreen button {
    background: var(--green); color: #000; border: none; padding: 8px 24px;
    border-radius: 20px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
  }

  /* ── LYRICS OVERLAY ── */
  #lyricsOverlay {
    position: fixed; inset: 0; bottom: 80px; background: linear-gradient(180deg, #3d3d3d 0%, #0a0a0a 100%);
    z-index: 90; display: none; flex-direction: column; padding: 30px; overflow-y: auto;
  }
  #lyricsOverlay.open { display: flex; }
  .lyrics-close { align-self: flex-end; background: rgba(0,0,0,0.4); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 12px; }
  .lyrics-container { max-width: 700px; margin: 20px auto; width: 100%; }
  .lyrics-title { font-size: 32px; font-weight: 700; margin-bottom: 6px; }
  .lyrics-artist { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
  .lyrics-content { font-size: 26px; font-weight: 700; line-height: 1.5; color: #fff; white-space: pre-wrap; letter-spacing: -0.5px; }

  /* ── SIDEBAR (UTZOOMAD) ── */
  .sidebar {
    background: var(--sidebar); grid-row: 1; display: flex; flex-direction: column; padding: 12px 6px; overflow-y: auto; border-right: 1px solid var(--border);
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--green); padding: 6px 12px 16px; display: flex; align-items: center; gap: 6px; }
  .logo svg { width: 22px; height: 22px; }

  .nav-section { margin-bottom: 16px; }
  .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--muted); padding: 4px 12px 6px; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; }
  .nav-item:hover, .nav-item.active { color: var(--text); background: var(--card-hover); }
  .nav-item.active { color: var(--green); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .divider { height: 1px; background: var(--border); margin: 8px 6px; }

  .playlist-list { flex: 1; overflow-y: auto; }
  .playlist-item { padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: 12.5px; border-radius: 4px; display: flex; align-items: center; gap: 8px; }
  .playlist-item:hover { color: var(--text); background: var(--card-hover); }
  .playlist-item.active { color: var(--text); background: rgba(29, 185, 84, 0.1); }
  .playlist-item-thumb { width: 22px; height: 22px; border-radius: 3px; background: var(--card-hover); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; overflow: hidden; }
  .playlist-item-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .new-playlist-btn { margin: 4px 12px; padding: 8px 10px; background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; display: flex; align-items: center; gap: 6px; width: calc(100% - 24px); }
  .new-playlist-btn:hover { border-color: var(--green); color: var(--green); background: rgba(29, 185, 84, 0.03); }

  /* ── MAIN CONTENT (UTZOOMAD) ── */
  .main { grid-row: 1; overflow-y: auto; background: linear-gradient(180deg, #12121f 0%, var(--bg) 300px); }
  .main-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; position: sticky; top: 0; background: rgba(10,10,10,0.8); backdrop-filter: blur(12px); z-index: 10; }
  .view-title { font-size: 22px; font-weight: 700; }

  .upload-btn { background: var(--green); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .upload-btn:hover { background: var(--green-dark); }
  .upload-btn svg { width: 14px; height: 14px; }

  .content-area { padding: 0 24px 32px; }

  /* ── PLAYLIST HEADER (UTZOOMAD) ── */
  .playlist-header { display: flex; align-items: flex-end; gap: 20px; padding: 16px 0 24px; }
  .playlist-cover { width: 160px; height: 160px; border-radius: 6px; background: linear-gradient(135deg, #282828, #121212); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 16px rgba(0,0,0,0.5); font-size: 50px; overflow: hidden; }
  .playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
  .playlist-meta h1 { font-size: 44px; font-weight: 700; line-height: 1.1; margin-bottom: 4px; letter-spacing: -1px; }
  .playlist-meta p { color: var(--muted); font-size: 13px; }
  .playlist-track-count { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  .play-all-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; color: #000; margin-bottom: 20px; box-shadow: 0 6px 16px rgba(29,185,84,.3); }
  .play-all-btn:hover { background: var(--green-dark); }
  .play-all-btn svg { width: 22px; height: 22px; }

  /* ── LÅTLISTA (KOMPAKT & UTZOOMAD) ── */
  .track-list-header { display: grid; grid-template-columns: 36px 1fr 1fr 60px; padding: 0 12px 6px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .track-row { display: grid; grid-template-columns: 36px 1fr 1fr 60px; padding: 6px 12px; border-radius: 4px; align-items: center; cursor: pointer; position: relative; }
  .track-row:hover { background: var(--card-hover); }
  .track-row.playing { color: var(--green); background: rgba(29, 185, 84, 0.04); }

  .track-num { color: var(--muted); font-size: 13px; text-align: center; position: relative; width: 16px; }
  .track-row.playing .track-num { color: var(--green); }
  .track-play-icon { display: none; position: absolute; inset: 0; place-items: center; color: var(--green); font-size: 11px; }
  .track-row:hover .track-num-text { display: none; }
  .track-row:hover .track-play-icon { display: grid; }

  .track-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
  .track-thumb { width: 32px; height: 32px; border-radius: 3px; background: var(--card-hover); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: 14px; }
  .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .track-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .track-row.playing .track-name { color: var(--green); }
  .track-artist { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-duration { font-size: 13px; color: var(--muted); text-align: right; }

  .section-title { font-size: 16px; font-weight: 700; margin: 16px 0 12px; }
  
  /* ── CARDS GRID (UTZOOMAD) ── */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border-radius: 6px; padding: 12px; cursor: pointer; }
  .card:hover { background: var(--card-hover); }
  .card-img { width: 100%; aspect-ratio: 1; border-radius: 4px; background: linear-gradient(135deg, #282828, #121212); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-sub { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }

  /* ── COMPACT PLAYER FOOTER ── */
  .player { grid-column: 1 / -1; grid-row: 2; background: var(--player-bg); border-top: 1px solid var(--border); display: grid; grid-template-columns: 240px 1fr 240px; align-items: center; padding: 0 16px; z-index: 20; }
  .now-playing { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .now-thumb { width: 44px; height: 44px; border-radius: 3px; background: var(--card-hover); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-size: 16px; }
  .player .now-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .now-info { min-width: 0; }
  .now-title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
  .now-artist { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 500px; margin: 0 auto; }
  .player-controls { display: flex; align-items: center; gap: 16px; }
  .ctrl-btn { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px; }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn.active { color: var(--green); }
  .ctrl-btn svg { width: 16px; height: 16px; }
  
  .play-pause-btn { width: 32px; height: 32px; background: var(--text); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; }
  .play-pause-btn svg { width: 14px; height: 14px; }

  .progress-bar-area { display: flex; align-items: center; gap: 10px; width: 100%; }
  .time-label { font-size: 10px; color: var(--muted); width: 30px; text-align: center; flex-shrink: 0; }
  .progress-bar { flex: 1; height: 3px; background: #333; border-radius: 2px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; }
  .progress-bar:hover { height: 5px; }

  .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .lyrics-toggle-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .lyrics-toggle-btn:hover { color: #fff; border-color: #fff; }
  .lyrics-toggle-btn.active { background: #fff; color: #000; border-color: #fff; }

  .volume-area { display: flex; align-items: center; gap: 6px; }
  .volume-bar { width: 70px; height: 3px; background: #333; border-radius: 2px; cursor: pointer; }
  .volume-fill { height: 100%; background: var(--muted); border-radius: 2px; }
  .volume-bar:hover .volume-fill { background: var(--green); }

  /* ── MODALER (UTZOOMAD) ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #282828; border-radius: 8px; padding: 24px; width: 440px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 16px 32px rgba(0,0,0,0.6); }
  .modal h2 { font-size: 18px; margin-bottom: 16px; font-weight: 700; }
  
  .modal input, .modal select, .modal textarea { width: 100%; background: #1e1e1e; border: 1px solid transparent; border-radius: 4px; color: var(--text); font-family: inherit; font-size: 13px; padding: 10px 12px; margin-bottom: 12px; outline: none; }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal select { -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; }
  
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn-cancel { background: transparent; border: none; color: #fff; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }
  .btn-confirm { background: var(--green); color: #000; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }

  .drop-zone { border: 2px dashed #404040; border-radius: 6px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 12px; color: var(--muted); font-size: 12.5px; }
  .drop-zone:hover { border-color: var(--green); color: var(--green); }

  .upload-list { max-height: 160px; overflow-y: auto; margin-bottom: 12px; padding: 4px; background: #1a1a1a; border-radius: 4px; }
  .upload-item { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .upload-item-header { display: flex; align-items: center; gap: 10px; }
  .upload-item-img-pick { width: 36px; height: 36px; border-radius: 4px; background: var(--card-hover); border: 1px dashed #555; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .upload-item-inputs { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .upload-item-inputs input { margin: 0; padding: 6px 10px; font-size: 12px; }

  .image-preview-box { width: 120px; height: 120px; border-radius: 6px; overflow: hidden; background: #1e1e1e; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; position: relative; cursor: pointer; }
  .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview-box .img-placeholder { color: var(--muted); font-size: 36px; }
  .image-preview-box .img-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; opacity: 0; font-size: 11px; color: white; }
  .image-preview-box:hover .img-overlay { opacity: 1; }

  .upload-label { font-size: 10px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* ── HÖGERKLICKSMENY ── */
  .context-menu { position: fixed; background: #282828; border-radius: 4px; padding: 4px; z-index: 200; min-width: 170px; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none; border: 1px solid #3e3e3e; }
  .context-menu.open { display: block; }
  .ctx-item { position: relative; padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; color: #eaeaea; }
  .ctx-item:hover { background: var(--card-hover); color: #fff; }
  .ctx-item.danger { color: #ff5555; }
  .ctx-item.danger:hover { background: #e54444; color: #fff; }
  
  .ctx-submenu { position: absolute; left: 100%; top: 0; background: #282828; border-radius: 4px; padding: 4px; min-width: 160px; display: none; max-height: 200px; overflow-y: auto; border: 1px solid #3e3e3e; }
  .ctx-item:hover .ctx-submenu { display: block; }
  .sub-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-item:hover { background: var(--card-hover); color: var(--green); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3e3e3e; border-radius: 3px; }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Sprotify</h1>
  <input type="password" id="passInput" placeholder="Skriv in lösenord...">
  <button onclick="checkPassword()">Lås upp</button>
</div>

<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    Sprotify
  </div>
  <div class="nav-section">
    <div class="nav-item active" id="navHome" onclick="showView('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Hem
    </div>
    <div class="nav-item" id="navLibrary" onclick="showView('library')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      Bibliotek
    </div>
  </div>
  <div class="divider"></div>
  <div class="nav-section">
    <div class="nav-label">Spellistor</div>
    <button class="new-playlist-btn" onclick="openNewPlaylist()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Ny spellista
    </button>
    <div class="playlist-list" id="playlistList"></div>
  </div>
</aside>

<main class="main" id="mainContent">
  <div class="main-header">
    <div class="view-title" id="viewTitle">Hem</div>
    <button class="upload-btn" onclick="openUpload()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      Ladda upp musik
    </button>
  </div>
  <div class="content-area" id="contentArea"></div>
</main>

<footer class="player">
  <div class="now-playing">
    <div class="now-thumb" id="nowThumb">🎵</div>
    <div class="now-info">
      <div class="now-title" id="nowTitle">Ingen låt vald</div>
      <div class="now-artist" id="nowArtist">–</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-pause-btn" onclick="togglePlay()" id="playPauseBtn">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repetera">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="progress-bar-area">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="time-label" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <button class="lyrics-toggle-btn" id="lyricsToggleBtn" onclick="toggleLyricsPanel()">LYRICS</button>
    <div class="volume-area">
      <div class="volume-bar" id="volumeBar" onclick="setVolume(event)">
        <div class="volume-fill" id="volumeFill" style="width:80%"></div>
      </div>
    </div>
  </div>
</footer>

<div id="lyricsOverlay">
  <button class="lyrics-close" onclick="toggleLyricsPanel()">Stäng ✕</button>
  <div class="lyrics-container">
    <div class="lyrics-title" id="lyricsPanelTitle">Låttitel</div>
    <div class="lyrics-artist" id="lyricsPanelArtist">Artist</div>
    <div class="lyrics-content" id="lyricsPanelContent">Ingen text tillgänglig.</div>
  </div>
</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>Ladda upp musik</h2>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <p>Välj ljudfiler</p>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none" onchange="handleFiles(this.files)">
    <div class="upload-list" id="uploadList"></div>
    
    <label class="upload-label">Välj spellista</label>
    <select id="uploadPlaylistSelect" onchange="toggleNewPlaylistInput(this.value)"></select>

    <div id="newPlaylistInputContainer" style="display: none;">
      <label class="upload-label">Skapa ny spellista med namnet:</label>
      <input type="text" id="uploadNewPlaylistName" placeholder="T.ex. Min nya lista">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('uploadModal')">Avbryt</button>
      <button class="btn-confirm" id="uploadConfirmBtn" onclick="confirmUpload()">Spara</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="playlistModal">
  <div class="modal">
    <h2>Ny spellista</h2>
    <div class="image-preview-box" onclick="document.getElementById('playlistImgInput').click()">
      <span class="img-placeholder" id="playlistImgPlaceholder">🎵</span>
      <img id="playlistImgPreview" src="" alt="" style="display:none">
      <div class="img-overlay">Välj bild</div>
    </div>
    <input type="file" id="playlistImgInput" accept="image/*" style="display:none" onchange="handlePlaylistImg(this)">
    <input type="text" id="playlistName" placeholder="Spellistans namn">
    <input type="text" id="playlistDesc" placeholder="Beskrivning">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('playlistModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmNewPlaylist()">Skapa</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editTrackModal">
  <div class="modal">
    <h2>Redigera låt</h2>
    <div class="image-preview-box" onclick="document.getElementById('editTrackImgInput').click()">
      <span class="img-placeholder" id="editTrackImgPlaceholder">🎵</span>
      <img id="editTrackImgPreview" src="" alt="" style="display:none">
    </div>
    <input type="file" id="editTrackImgInput" accept="image/*" style="display:none" onchange="handleEditTrackImg(this)">
    <input type="text" id="editTrackName" placeholder="Titel">
    <input type="text" id="editTrackArtist" placeholder="Artist">
    <label class="upload-label">Redigera Låttext</label>
    <textarea id="editTrackLyrics" placeholder="Klistra in hela texten här..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('editTrackModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmEditTrack()">Spara</button>
    </div>
  </div>
</div>

<div class="context-menu" id="contextMenu">
  <div class="ctx-item" onclick="ctxPlay()"><span>▶ Spela</span></div>
  <div class="ctx-item">
    <span>➕ Lägg till i spellista...</span>
    <div class="ctx-submenu" id="ctxSubmenuPlaylists"></div>
  </div>
  <div class="ctx-item" onclick="ctxEdit()"><span>✏ Redigera</span></div>
  <div class="ctx-item danger" onclick="ctxDelete()"><span>🗑 Ta bort</span></div>
</div>

<audio id="audioPlayer"></audio>

<script>
const supabaseUrl = "https://zsgvkgiakfadrlhfjhjv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZ3ZrZ2lha2ZhZHJsaGZqaGp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzE2NTUsImV4cCI6MjA5NTkwNzY1NX0.etPjB4_FrMQqRxfOPOrHmqpLyMYla3rO_xBVt-c0FFM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let state = { tracks: [], playlists: [], currentTrackId: null, currentPlaylistId: null, queue: [], queueIndex: -1, isPlaying: false, isRepeat: false, volume: 0.8, view: 'home' };
let pendingFiles = [];
let ctxTrackId = null;
let editingTrackId = null;
let editingTrackNewImg = null;
let newPlaylistImgFile = null;
const audio = document.getElementById('audioPlayer');

function checkPassword() {
  if(document.getElementById('passInput').value === 'gigglegiggle') {
    document.getElementById('loginScreen').style.display = 'none';
    load();
  } else {
    alert('Fel lösenord!');
  }
}

async function load() {
  try {
    const { data: pl } = await supabaseClient.from('playlists').select('*');
    state.playlists = pl || [];
    const { data: tr } = await supabaseClient.from('tracks').select('*');
    state.tracks = tr || [];
    audio.volume = state.volume;
    setupAudioListeners();
    renderAll();
  } catch(e) { console.error(e); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function showView(view, playlistId = null) {
  state.view = view;
  state.currentPlaylistId = playlistId;
  document.getElementById('navHome').classList.toggle('active', view === 'home');
  document.getElementById('navLibrary').classList.toggle('active', view === 'library');
  renderAll();
}

function renderAll() {
  renderPlaylistSidebar();
  renderMain();
  populateUploadPlaylistSelect();
}

function renderPlaylistSidebar() {
  const el = document.getElementById('playlistList'); el.innerHTML = '';
  state.playlists.forEach((p) => {
    const div = document.createElement('div');
    div.className = 'playlist-item' + (state.currentPlaylistId === p.id ? ' active' : '');
    div.onclick = () => showView('playlist', p.id);
    div.innerHTML = `<div class="playlist-item-thumb">${p.cover_url ? `<img src="${p.cover_url}">` : '🎵'}</div><span>${p.name}</span>`;
    el.appendChild(div);
  });
}

function renderMain() {
  const area = document.getElementById('contentArea'); area.innerHTML = '';
  const title = document.getElementById('viewTitle');

  if (state.view === 'home' || state.view === 'library') {
    title.textContent = state.view === 'home' ? 'Hem' : 'Bibliotek';
    
    const plTitle = document.createElement('div'); plTitle.className = 'section-title'; plTitle.textContent = 'Spellistor'; area.appendChild(plTitle);
    const grid = document.createElement('div'); grid.className = 'card-grid';
    state.playlists.forEach((p) => {
      const card = document.createElement('div'); card.className = 'card'; card.onclick = () => showView('playlist', p.id);
      card.innerHTML = `<div class="card-img">${p.cover_url ? `<img src="${p.cover_url}">` : '🎵'}</div><div class="card-name">${p.name}</div><div class="card-sub">${p.description || 'Spellista'}</div>`;
      grid.appendChild(card);
    });
    area.appendChild(grid);

    const trTitle = document.createElement('div'); trTitle.className = 'section-title'; trTitle.textContent = 'Alla Låtar'; area.appendChild(trTitle);
    renderTrackTable(state.tracks, area);
  } else if (state.view === 'playlist') {
    const pl = state.playlists.find(p => p.id === state.currentPlaylistId);
    if (!pl) return showView('home');
    title.textContent = '';
    const tracks = state.tracks.filter(t => t.playlists === pl.id);

    const header = document.createElement('div'); header.className = 'playlist-header';
    header.innerHTML = `<div class="playlist-cover">${pl.cover_url ? `<img src="${pl.cover_url}">` : '🎵'}</div><div class="playlist-meta"><p>SPELLISTA</p><h1>${pl.name}</h1><p>${pl.description || ''}</p><div class="playlist-track-count">${tracks.length} låtar</div></div>`;
    area.appendChild(header);

    if (tracks.length > 0) {
      const playBtn = document.createElement('button'); playBtn.className = 'play-all-btn';
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      playBtn.onclick = () => playList(tracks, 0);
      area.appendChild(playBtn);
    }
    renderTrackTable(tracks, area);
  }
}

function renderTrackTable(tracks, target) {
  if (tracks.length === 0) { target.innerHTML += `<div class="empty-state">Inga låtar här än</div>`; return; }
  const head = document.createElement('div'); head.className = 'track-list-header'; head.innerHTML = `<div>#</div><div>Titel</div><div>Artist</div><div style="text-align:right">Tid</div>`; target.appendChild(head);

  tracks.forEach((t, i) => {
    const row = document.createElement('div'); row.className = 'track-row' + (state.currentTrackId === t.id ? ' playing' : '');
    row.onclick = () => playList(tracks, i);
    row.oncontextmenu = (e) => openContextMenu(e, t.id);
    row.innerHTML = `<div class="track-num"><span class="track-num-text">${i+1}</span><span class="track-play-icon">▶</span></div><div class="track-info"><div class="track-thumb">${t.cover_url ? `<img src="${t.cover_url}">` : '🎵'}</div><div class="track-name">${t.title}</div></div><div class="track-artist">${t.artist || 'Okänd'}</div><div class="track-duration">3:30</div>`;
    target.appendChild(row);
  });
}

function populateUploadPlaylistSelect() {
  const sel = document.getElementById('uploadPlaylistSelect'); if(!sel) return;
  sel.innerHTML = '<option value="">-- Välj ingen --</option><option value="new_custom_playlist">➕ Skapa ny spellista...</option>';
  state.playlists.forEach(p => { sel.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
}
function toggleNewPlaylistInput(val) { document.getElementById('newPlaylistInputContainer').style.display = (val === 'new_custom_playlist') ? 'block' : 'none'; }

function openUpload() { document.getElementById('uploadModal').classList.add('open'); pendingFiles = []; document.getElementById('uploadList').innerHTML = ''; }
function openNewPlaylist() { document.getElementById('playlistModal').classList.add('open'); newPlaylistImgFile = null; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function handleFiles(files) {
  for (let f of files) {
    pendingFiles.push({ id: uid(), file: f, name: f.name.replace(/\.[^/.]+$/, ""), artist: "Okänd artist", lyrics: "", imageFile: null });
  }
  renderUploadList();
}

function renderUploadList() {
  const list = document.getElementById('uploadList'); list.innerHTML = '';
  pendingFiles.forEach((pf, i) => {
    const div = document.createElement('div'); div.className = 'upload-item';
    div.innerHTML = `
      <div class="upload-item-header">
        <div class="upload-item-img-pick" onclick="triggerItemImg(${i})"><span id="pf-thumb-${i}">🖼️</span></div>
        <div class="upload-item-inputs">
          <input type="text" value="${pf.name}" placeholder="Titel" onchange="pendingFiles[${i}].name = this.value">
          <input type="text" value="${pf.artist}" placeholder="Artist" onchange="pendingFiles[${i}].artist = this.value">
        </div>
      </div>
      <textarea placeholder="Låttext / Lyrics" onchange="pendingFiles[${i}].lyrics = this.value"></textarea>
    `;
    list.appendChild(div);
  });
}

function triggerItemImg(idx) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = (e) => { if(e.target.files[0]) { pendingFiles[idx].imageFile = e.target.files[0]; document.getElementById(`pf-thumb-${idx}`).textContent = "✅"; } };
  inp.click();
}

async function confirmUpload() {
  const btn = document.getElementById('uploadConfirmBtn'); btn.disabled = true; btn.textContent = 'Sparar...';
  let targetPlaylistId = document.getElementById('uploadPlaylistSelect').value;
  
  if (targetPlaylistId === 'new_custom_playlist') {
    const newName = document.getElementById('uploadNewPlaylistName').value.trim();
    if(newName) {
      const plId = uid();
      const { data } = await supabaseClient.from('playlists').insert({ id: plId, name: newName }).select().single();
      if(data) { state.playlists.push(data); targetPlaylistId = data.id; }
    } else { targetPlaylistId = null; }
  }

  for (let pf of pendingFiles) {
    let audioUrl = '', coverUrl = '';
    const audioName = `${pf.id}_audio.${pf.file.name.split('.').pop()}`;
    await supabaseClient.storage.from('songs').upload(audioName, pf.file);
    audioUrl = supabaseClient.storage.from('songs').getPublicUrl(audioName).data.publicUrl;

    if (pf.imageFile) {
      const imgName = `${pf.id}_cover.${pf.imageFile.name.split('.').pop()}`;
      await supabaseClient.storage.from('track-covers').upload(imgName, pf.imageFile);
      coverUrl = supabaseClient.storage.from('track-covers').getPublicUrl(imgName).data.publicUrl;
    }

    const { data } = await supabaseClient.from('tracks').insert({ id: pf.id, title: pf.name, artist: pf.artist, audio_url: audioUrl, cover_url: coverUrl, playlists: targetPlaylistId, lyrics: pf.lyrics }).select().single();
    if (data) state.tracks.push(data);
  }

  btn.disabled = false; btn.textContent = 'Spara'; closeModal('uploadModal'); renderAll();
}

function handlePlaylistImg(input) { if (input.files && input.files[0]) { newPlaylistImgFile = input.files[0]; document.getElementById('playlistImgPreview').src = URL.createObjectURL(newPlaylistImgFile); document.getElementById('playlistImgPreview').style.display='block'; document.getElementById('playlistImgPlaceholder').style.display='none'; } }

async function confirmNewPlaylist() {
  const name = document.getElementById('playlistName').value.trim(); if(!name) return;
  const desc = document.getElementById('playlistDesc').value.trim();
  const id = uid(); let coverUrl = '';
  if (newPlaylistImgFile) {
    const imgName = `${id}_pcover.${newPlaylistImgFile.name.split('.').pop()}`;
    await supabaseClient.storage.from('playlist-covers').upload(imgName, newPlaylistImgFile);
    coverUrl = supabaseClient.storage.from('playlist-covers').getPublicUrl(imgName).data.publicUrl;
  }
  const { data } = await supabaseClient.from('playlists').insert({ id, name, description: desc, cover_url: coverUrl }).select().single();
  if (data) { state.playlists.push(data); closeModal('playlistModal'); renderAll(); }
}

/* ── LYRICS PANEL OVERLAY ── */
function toggleLyricsPanel() {
  const panel = document.getElementById('lyricsOverlay');
  const btn = document.getElementById('lyricsToggleBtn');
  if(panel.classList.contains('open')) {
    panel.classList.remove('open');
    btn.classList.remove('active');
  } else {
    updateLyricsDisplay();
    panel.classList.add('open');
    btn.classList.add('active');
  }
}

function updateLyricsDisplay() {
  const currentTrack = state.tracks.find(t => t.id === state.currentTrackId);
  if(currentTrack) {
    document.getElementById('lyricsPanelTitle').textContent = currentTrack.title;
    document.getElementById('lyricsPanelArtist').textContent = currentTrack.artist || 'Okänd';
    document.getElementById('lyricsPanelContent').textContent = currentTrack.lyrics || "Det finns ingen sparad text för den här låten.";
  } else {
    document.getElementById('lyricsPanelTitle').textContent = "Ingen låt spelas";
    document.getElementById('lyricsPanelContent').textContent = "Välj en låt för att se text.";
  }
}

/* ── SPELAREN & LOGIK ── */
function playList(list, index) { state.queue = list; state.queueIndex = index; if(list[index]) loadTrack(list[index].id); }
function loadTrack(id) {
  const track = state.tracks.find(t => t.id === id); if(!track) return;
  state.currentTrackId = id; audio.src = track.audio_url;
  document.getElementById('nowTitle').textContent = track.title; document.getElementById('nowArtist').textContent = track.artist || '–';
  document.getElementById('nowThumb').innerHTML = track.cover_url ? `<img src="${track.cover_url}">` : '🎵';
  audio.play(); state.isPlaying = true; updatePlayButton(); updateLyricsDisplay(); renderAll();
}
function togglePlay() {
  if(!state.currentTrackId && state.tracks.length > 0) return playList(state.tracks, 0);
  if(state.isPlaying) { audio.pause(); state.isPlaying = false; } else { audio.play(); state.isPlaying = true; }
  updatePlayButton();
}
function updatePlayButton() { document.getElementById('playIcon').innerHTML = state.isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }
function nextTrack() { if(state.queue.length > 0) { state.queueIndex = (state.queueIndex + 1) % state.queue.length; loadTrack(state.queue[state.queueIndex].id); } }
function prevTrack() { if(state.queue.length > 0) { state.queueIndex = (state.queueIndex - 1 + state.queue.length) % state.queue.length; loadTrack(state.queue[state.queueIndex].id); } }

// REPEAT FUNKTION
function toggleRepeat() {
  state.isRepeat = !state.isRepeat;
  document.getElementById('repeatBtn').classList.toggle('active', state.isRepeat);
}

function setupAudioListeners() {
  audio.ontimeupdate = () => {
    document.getElementById('progressFill').style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    const m = Math.floor(audio.currentTime/60), s = Math.floor(audio.currentTime%60);
    document.getElementById('currentTime').textContent = m + ':' + String(s).padStart(2, '0');
  };
  audio.onended = () => {
    if(state.isRepeat) {
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  };
}
function seekTo(e) { audio.currentTime = (e.offsetX / document.getElementById('progressBar').offsetWidth) * audio.duration; }
function setVolume(e) { state.volume = e.offsetX / document.getElementById('volumeBar').offsetWidth; audio.volume = state.volume; document.getElementById('volumeFill').style.width = (state.volume * 100) + '%'; }

/* ── HÖGERKLICKSMENY ── */
function openContextMenu(e, id) {
  e.preventDefault(); ctxTrackId = id;
  const menu = document.getElementById('contextMenu');
  const sub = document.getElementById('ctxSubmenuPlaylists'); sub.innerHTML = '';
  
  state.playlists.forEach(p => {
    const item = document.createElement('div'); item.className = 'sub-item'; item.textContent = p.name;
    item.onclick = async (ev) => { ev.stopPropagation(); await supabaseClient.from('tracks').update({ playlists: p.id }).eq('id', ctxTrackId); const idx = state.tracks.findIndex(t => t.id === ctxTrackId); if(idx !== -1) state.tracks[idx].playlists = p.id; closeContextMenu(); renderAll(); };
    sub.appendChild(item);
  });

  menu.style.top = e.clientY + 'px'; menu.style.left = e.clientX + 'px'; menu.classList.add('open');
  setTimeout(() => document.addEventListener('click', closeContextMenu), 10);
}
function closeContextMenu() { document.getElementById('contextMenu').classList.remove('open'); document.removeEventListener('click', closeContextMenu); }
function ctxPlay() { if(ctxTrackId) loadTrack(ctxTrackId); }

function ctxEdit() {
  const track = state.tracks.find(t => t.id === ctxTrackId); if(!track) return;
  editingTrackId = track.id; editingTrackNewImg = null;
  document.getElementById('editTrackName').value = track.title;
  document.getElementById('editTrackArtist').value = track.artist;
  document.getElementById('editTrackLyrics').value = track.lyrics || '';
  document.getElementById('editTrackModal').classList.add('open');
}
function handleEditTrackImg(i) { if(i.files && i.files[0]) editingTrackNewImg = i.files[0]; }

async function confirmEditTrack() {
  const title = document.getElementById('editTrackName').value.trim();
  const artist = document.getElementById('editTrackArtist').value.trim();
  const lyrics = document.getElementById('editTrackLyrics').value.trim();
  await supabaseClient.from('tracks').update({ title, artist, lyrics }).eq('id', editingTrackId);
  const idx = state.tracks.findIndex(t => t.id === editingTrackId);
  if(idx !== -1) { state.tracks[idx].title = title; state.tracks[idx].artist = artist; state.tracks[idx].lyrics = lyrics; }
  closeModal('editTrackModal'); updateLyricsDisplay(); renderAll();
}

async function ctxDelete() {
  await supabaseClient.from('tracks').delete().eq('id', ctxTrackId);
  state.tracks = state.tracks.filter(t => t.id !== ctxTrackId);
  renderAll();
}
</script>
</body>
</html>
