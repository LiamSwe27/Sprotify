<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprotify – Din Musik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --green: #1db954;
    --green-dark: #17a349;
    --bg: #0a0a0a;
    --sidebar: #111111;
    --card: #181818;
    --card-hover: #282828;
    --text: #ffffff;
    --muted: #b3b3b3;
    --border: #282828;
    --player-bg: #181818;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr 90px;
    overflow: hidden;
    user-select: none;
  }

  .sidebar {
    background: var(--sidebar);
    grid-row: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 8px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--green);
    padding: 8px 16px 24px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo svg { width: 28px; height: 28px; }

  .nav-section { margin-bottom: 20px; }
  .nav-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--muted);
    padding: 4px 16px 8px;
    text-transform: uppercase;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    transition: all .15s;
  }
  .nav-item:hover, .nav-item.active { color: var(--text); background: var(--card-hover); }
  .nav-item.active { color: var(--green); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .divider { height: 1px; background: var(--border); margin: 12px 8px; }

  .playlist-list { flex: 1; overflow-y: auto; }
  .playlist-item {
    padding: 8px 16px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
    border-radius: 4px;
    transition: all .15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .playlist-item:hover { color: var(--text); background: var(--card-hover); }
  .playlist-item.active { color: var(--text); }
  .playlist-item-thumb {
    width: 24px; height: 24px; border-radius: 3px;
    background: var(--card-hover);
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .playlist-item-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .new-playlist-btn {
    margin: 8px 16px;
    padding: 8px 12px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all .15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .new-playlist-btn:hover { border-color: var(--green); color: var(--green); }

  .main {
    grid-row: 1;
    overflow-y: auto;
    background: linear-gradient(180deg, #1a1a2e 0%, var(--bg) 300px);
  }

  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px 16px;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .view-title { font-size: 24px; font-weight: 700; }

  .upload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .upload-btn:hover { background: var(--green-dark); transform: scale(1.03); }
  .upload-btn svg { width: 16px; height: 16px; }

  .content-area { padding: 16px 32px 32px; }

  .playlist-header {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 32px;
    padding: 24px 0;
  }
  .playlist-cover {
    width: 200px;
    height: 200px;
    border-radius: 8px;
    background: linear-gradient(135deg, #1db954, #191414);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    font-size: 64px;
    overflow: hidden;
    position: relative;
  }
  .playlist-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

  .playlist-meta h1 { font-size: 48px; font-weight: 700; line-height: 1.1; margin-bottom: 8px; }
  .playlist-meta p { color: var(--muted); font-size: 14px; }
  .playlist-track-count { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .play-all-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    cursor: pointer;
    color: #000;
    margin-bottom: 16px;
    transition: all .2s;
    box-shadow: 0 8px 24px rgba(29,185,84,.3);
  }
  .play-all-btn:hover { transform: scale(1.08); background: var(--green-dark); }

  .track-list-header {
    display: grid;
    grid-template-columns: 40px 1fr 160px 60px;
    padding: 0 16px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .track-row {
    display: grid;
    grid-template-columns: 40px 1fr 160px 60px;
    padding: 6px 16px;
    border-radius: 6px;
    align-items: center;
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .track-row:hover { background: var(--card-hover); }
  .track-row.playing { color: var(--green); }

  .track-num {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    position: relative;
  }
  .track-row.playing .track-num { color: var(--green); }
  .track-play-icon { display: none; position: absolute; inset: 0; place-items: center; }
  .track-row:hover .track-num-text { display: none; }
  .track-row:hover .track-play-icon { display: grid; }
  .track-row.playing .track-num-text { display: none; }
  .track-row.playing .track-play-icon { display: grid; }

  .track-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
  .track-thumb {
    width: 40px; height: 40px; border-radius: 4px;
    background: var(--card-hover); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--muted);
  }
  .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .track-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .track-playlist { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-duration { font-size: 13px; color: var(--muted); text-align: right; }

  .track-actions {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    gap: 4px;
  }
  .track-row:hover .track-actions { display: flex; }
  .track-action-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    transition: color .12s;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .track-action-btn:hover { color: var(--text); }

  .section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; margin-top: 8px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: background .2s;
  }
  .card:hover { background: var(--card-hover); }
  .card-img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    background: linear-gradient(135deg, #1db954, #191414);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.4);
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .player {
    grid-column: 1 / -1;
    grid-row: 2;
    background: var(--player-bg);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    align-items: center;
    padding: 0 24px;
  }

  .now-playing { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .now-thumb {
    width: 52px; height: 52px; border-radius: 4px;
    background: var(--card-hover);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--muted);
  }
  .now-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .now-info { min-width: 0; }
  .now-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-artist { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .player-controls { display: flex; align-items: center; gap: 16px; }
  .ctrl-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn svg { width: 18px; height: 18px; }
  .play-pause-btn {
    width: 36px; height: 36px;
    background: var(--text);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    transition: transform .15s;
  }
  .play-pause-btn:hover { transform: scale(1.08); }
  .play-pause-btn svg { width: 16px; height: 16px; }

  .progress-bar-area { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; }
  .time-label { font-size: 11px; color: var(--muted); width: 35px; text-align: center; flex-shrink: 0; }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width .1s linear;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    width: 12px; height: 12px;
    background: white;
    border-radius: 50%;
    position: absolute;
    right: -6px; top: -4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .progress-bar:hover .progress-fill::after { opacity: 1; }

  .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .volume-area { display: flex; align-items: center; gap: 8px; }
  .volume-bar { width: 80px; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; }
  .volume-fill { height: 100%; background: var(--muted); border-radius: 2px; }

  /* ── MODALER ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: #282828;
    border-radius: 12px;
    padding: 32px;
    width: 460px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(.95);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h2 { font-size: 20px; margin-bottom: 20px; }
  .modal input {
    width: 100%;
    background: #3e3e3e;
    border: 1px solid #555;
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border .15s;
  }
  .modal input:focus { border-color: var(--green); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
  .btn-cancel {
    background: transparent; border: 1px solid var(--muted);
    color: var(--text); padding: 8px 20px; border-radius: 24px;
    cursor: pointer; font-family: inherit; font-size: 13px;
    transition: border-color .15s;
  }
  .btn-cancel:hover { border-color: var(--text); }
  .btn-confirm {
    background: var(--green); color: #000; border: none;
    padding: 8px 20px; border-radius: 24px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700;
    transition: background .15s;
  }
  .btn-confirm:hover { background: var(--green-dark); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 12px;
    color: var(--muted);
  }
  .drop-zone:hover { border-color: var(--green); color: var(--green); }
  .drop-zone svg { width: 36px; height: 36px; margin-bottom: 8px; }
  .drop-zone p { font-size: 14px; }
  .drop-zone span { font-size: 12px; }

  .upload-list { max-height: 260px; overflow-y: auto; margin-bottom: 12px; }
  .upload-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .upload-item:last-child { border: none; }
  .upload-item-img-pick {
    width: 44px; height: 44px; border-radius: 6px;
    background: var(--card-hover);
    border: 1px dashed var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: border-color .15s;
    position: relative;
  }
  .upload-item-img-pick:hover { border-color: var(--green); }
  .upload-item-inputs { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .upload-item-inputs input { margin: 0; padding: 6px 10px; font-size: 12px; }

  .image-preview-box {
    width: 160px; height: 160px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-hover);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    position: relative;
    cursor: pointer;
  }
  .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview-box .img-placeholder { color: var(--muted); font-size: 48px; }
  .image-preview-box .img-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .2s;
    font-size: 12px; color: white; flex-direction: column; gap: 4px;
  }
  .image-preview-box:hover .img-overlay { opacity: 1; }
  .image-preview-box .img-overlay svg { width: 22px; height: 22px; }

  .upload-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    display: block;
  }

  .empty-state { text-align: center; padding: 64px 32px; color: var(--muted); }
  .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

  .context-menu {
    position: fixed;
    background: #282828;
    border-radius: 8px;
    padding: 4px;
    z-index: 200;
    min-width: 180px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    display: none;
  }
  .context-menu.open { display: block; }
  .ctx-item { padding: 10px 16px; font-size: 13px; cursor: pointer; border-radius: 4px; transition: background .12s; }
  .ctx-item:hover { background: var(--card-hover); }
  .ctx-item.danger { color: #e05555; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    Sprotify
  </div>
  <div class="nav-section">
    <div class="nav-item active" id="navHome" onclick="showView('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Hem
    </div>
    <div class="nav-item" id="navLibrary" onclick="showView('library')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
      Bibliotek
    </div>
  </div>
  <div class="divider"></div>
  <div class="nav-section">
    <div class="nav-label">Spellistor</div>
    <button class="new-playlist-btn" onclick="openNewPlaylist()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Ny spellista
    </button>
    <div class="playlist-list" id="playlistList"></div>
  </div>
</aside>

<main class="main" id="mainContent">
  <div class="main-header">
    <div class="view-title" id="viewTitle">Hem</div>
    <button class="upload-btn" onclick="openUpload()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      Ladda upp musik
    </button>
  </div>
  <div class="content-area" id="contentArea"></div>
</main>

<footer class="player">
  <div class="now-playing">
    <div class="now-thumb" id="nowThumb">🎵</div>
    <div class="now-info">
      <div class="now-title" id="nowTitle">Ingen låt vald</div>
      <div class="now-artist" id="nowArtist">–</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()" title="Föregående">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-pause-btn" onclick="togglePlay()" id="playPauseBtn">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Nästa">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Upprepa" style="color: var(--muted);">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="progress-bar-area">
      <span class="time-label" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="time-label" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="player-right">

<script>
const supabaseUrl = "https://zsgvkgiakfadrlhfjhjv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZ3ZrZ2lha2ZhZHJsaGZqaGp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzE2NTUsImV4cCI6MjA5NTkwNzY1NX0.etPjB4_FrMQqRxfOPOrHmqpLyMYla3rO_xBVt-c0FFM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let state = {
  tracks: [], playlists: [],
  currentTrackId: null, currentPlaylistId: null,
  queue: [], queueIndex: -1,
  isPlaying: false, repeat: 'none',
  volume: 0.8, view: 'home'
};

let pendingFiles = []; 
let ctxTrackId = null;
let ctxType = 'track';
let editingTrackId = null;
let editingTrackNewImg = null;
let editingPlaylistId = null;
let editingPlaylistNewImg = null;
let newPlaylistImgFile = null;
const audio = document.getElementById('audioPlayer');

window.onload = load;

async function load() {
  try {
    const { data: pl } = await supabaseClient.from('playlists').select('*');
    state.playlists = pl || [];
    const { data: tr } = await supabaseClient.from('tracks').select('*');
    state.tracks = tr || [];

    audio.volume = state.volume;
    setupAudioListeners();
    renderAll();
  } catch(e) { console.error(e); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function getTracksByPlaylist(pid) {
  if (!pid) return state.tracks;
  return state.tracks.filter(t => t.playlists === pid);
}
function coverEmoji(idx) { return ['🎵','🎶','🎸','🥁','🎹','🎺','🎻','🎤','🎧','🎼'][idx % 10]; }

function showView(view, playlistId = null) {
  state.view = view;
  state.currentPlaylistId = playlistId;
  document.getElementById('navHome').classList.toggle('active', view === 'home');
  document.getElementById('navLibrary').classList.toggle('active', view === 'library');
  renderAll();
}

function renderAll() {
  renderPlaylistSidebar();
  renderMain();
}

function renderPlaylistSidebar() {
  const el = document.getElementById('playlistList');
  el.innerHTML = '';
  state.playlists.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'playlist-item' + (state.currentPlaylistId === p.id ? ' active' : '');
    div.onclick = () => showView('playlist', p.id);
    div.oncontextmenu = (e) => openContextMenu(e, p.id, 'playlist');
    
    const thumb = document.createElement('div');
    thumb.className = 'playlist-item-thumb';
    if (p.cover_url) thumb.innerHTML = `<img src="${p.cover_url}">`;
    else thumb.textContent = coverEmoji(idx);

    const nameSpan = document.createElement('span');
    nameSpan.textContent = p.name;

    div.appendChild(thumb);
    div.appendChild(nameSpan);
    el.appendChild(div);
  });
}

function renderMain() {
  const area = document.getElementById('contentArea');
  const title = document.getElementById('viewTitle');
  area.innerHTML = '';

  if (state.view === 'home' || state.view === 'library') {
    title.textContent = state.view === 'home' ? 'Hem' : 'Mitt Bibliotek';
    
    const plTitle = document.createElement('div');
    plTitle.className = 'section-title';
    plTitle.textContent = 'Spellistor';
    area.appendChild(plTitle);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    state.playlists.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => showView('playlist', p.id);
      card.oncontextmenu = (e) => openContextMenu(e, p.id, 'playlist');
      card.innerHTML = `
        <div class="card-img">${p.cover_url ? `<img src="${p.cover_url}">` : coverEmoji(idx)}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-sub">${p.description || 'Spellista'}</div>
      `;
      grid.appendChild(card);
    });
    area.appendChild(grid);

    const trTitle = document.createElement('div');
    trTitle.className = 'section-title';
    trTitle.textContent = 'Alla Låtar';
    area.appendChild(trTitle);
    renderTrackTable(state.tracks, area);

  } else if (state.view === 'playlist') {
    const pl = state.playlists.find(p => p.id === state.currentPlaylistId);
    if (!pl) return showView('home');
    
    title.textContent = '';
    const tracks = getTracksByPlaylist(pl.id);

    const header = document.createElement('div');
    header.className = 'playlist-header';
    header.innerHTML = `
      <div class="playlist-cover">${pl.cover_url ? `<img src="${pl.cover_url}">` : '🎵'}</div>
      <div class="playlist-meta">
        <p>SPELLISTA</p>
        <h1>${pl.name}</h1>
        <p>${pl.description || ''}</p>
        <div class="playlist-track-count">${tracks.length} låtar</div>
      </div>
    `;
    area.appendChild(header);

    if (tracks.length > 0) {
      const playBtn = document.createElement('button');
      playBtn.className = 'play-all-btn';
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M8 5v14l11-7z"/></svg>';
      playBtn.onclick = () => playList(tracks, 0);
      area.appendChild(playBtn);
    }

    renderTrackTable(tracks, area);
  }
}

function renderTrackTable(tracks, target) {
  if (tracks.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty-state';
    div.innerHTML = `<h3>Inga låtar här än</h3>`;
    target.appendChild(div);
    return;
  }

  const head = document.createElement('div');
  head.className = 'track-list-header';
  head.innerHTML = `<div>#</div><div>Titel</div><div>Artist</div><div style="text-align:right">Tid</div>`;
  target.appendChild(head);

  tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (state.currentTrackId === t.id ? ' playing' : '');
    row.onclick = () => playList(tracks, i);
    row.oncontextmenu = (e) => openContextMenu(e, t.id, 'track');

    row.innerHTML = `
      <div class="track-num">
        <span class="track-num-text">${i+1}</span>
        <span class="track-play-icon">▶</span>
      </div>
      <div class="track-info">
        <div class="track-thumb">${t.cover_url ? `<img src="${t.cover_url}">` : '🎵'}</div>
        <div class="track-name">${t.title}</div>
      </div>
      <div class="track-artist">${t.artist || 'Okänd'}</div>
      <div class="track-duration">3:30</div>
    `;
    target.appendChild(row);
  });
}

/* ─── UPLOADS ─── */
function openUpload() { document.getElementById('uploadModal').classList.add('open'); pendingFiles = []; document.getElementById('uploadList').innerHTML = ''; }
function openNewPlaylist() { document.getElementById('playlistModal').classList.add('open'); newPlaylistImgFile = null; document.getElementById('playlistImgPreview').style.display='none'; document.getElementById('playlistImgPlaceholder').style.display='block'; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function handleFiles(files) {
  for (let f of files) {
    const id = uid();
    pendingFiles.push({ id, file: f, name: f.name.replace(/\.[^/.]+$/, ""), artist: "Okänd artist", imageFile: null });
  }
  renderUploadList();
}

function renderUploadList() {
  const list = document.getElementById('uploadList');
  list.innerHTML = '';
  pendingFiles.forEach((pf, i) => {
    const div = document.createElement('div');
    div.className = 'upload-item';
    div.innerHTML = `
      <div class="upload-item-img-pick" onclick="triggerItemImg(${i})">
        <span class="img-add-icon" id="pf-thumb-${i}">🖼️</span>
      </div>
      <div class="upload-item-inputs">
        <input type="text" value="${pf.name}" onchange="pendingFiles[${i}].name = this.value">
        <input type="text" value="${pf.artist}" onchange="pendingFiles[${i}].artist = this.value">
      </div>
    `;
    list.appendChild(div);
  });
}

function triggerItemImg(idx) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = (e) => {
    if(e.target.files[0]) {
      pendingFiles[idx].imageFile = e.target.files[0];
      document.getElementById(`pf-thumb-${idx}`).textContent = "✅";
    }
  };
  inp.click();
}

async function confirmUpload() {
  const btn = document.getElementById('uploadConfirmBtn');
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Sparar...';
  
  let targetPlaylistId = null;
  const plName = document.getElementById('uploadPlaylist').value.trim();
  if (plName) {
    let pl = state.playlists.find(p => p.name.toLowerCase() === plName.toLowerCase());
    if (!pl) {
      const id = uid();
      const { data } = await supabaseClient.from('playlists').insert({ id, name: plName }).select().single();
      if(data) { state.playlists.push(data); targetPlaylistId = data.id; }
    } else { targetPlaylistId = pl.id; }
  }

  for (let pf of pendingFiles) {
    let audioUrl = '';
    let coverUrl = '';

    const audioName = `${pf.id}_audio.${pf.file.name.split('.').pop()}`;
    const { error: aErr } = await supabaseClient.storage.from('songs').upload(audioName, pf.file);
    if (!aErr) audioUrl = supabaseClient.storage.from('songs').getPublicUrl(audioName).data.publicUrl;

    if (pf.imageFile) {
      const imgName = `${pf.id}_cover.${pf.imageFile.name.split('.').pop()}`;
      const { error: iErr } = await supabaseClient.storage.from('track-covers').upload(imgName, pf.imageFile);
      if (!iErr) coverUrl = supabaseClient.storage.from('track-covers').getPublicUrl(imgName).data.publicUrl;
    }

    const newTrack = { id: pf.id, title: pf.name, artist: pf.artist, audio_url: audioUrl, cover_url: coverUrl, playlists: targetPlaylistId };
    const { data } = await supabaseClient.from('tracks').insert(newTrack).select().single();
    if (data) state.tracks.push(data);
  }

  btn.disabled = false; btn.textContent = 'Spara låtar';
  closeModal('uploadModal');
  renderAll();
}

function handlePlaylistImg(input) {
  if (input.files && input.files[0]) {
    newPlaylistImgFile = input.files[0];
    document.getElementById('playlistImgPreview').src = URL.createObjectURL(newPlaylistImgFile);
    document.getElementById('playlistImgPreview').style.display = 'block';
    document.getElementById('playlistImgPlaceholder').style.display = 'none';
  }
}

async function confirmNewPlaylist() {
  const name = document.getElementById('playlistName').value.trim();
  const desc = document.getElementById('playlistDesc').value.trim();
  if(!name) return;

  const id = uid();
  let coverUrl = '';

  if (newPlaylistImgFile) {
    const imgName = `${id}_pcover.${newPlaylistImgFile.name.split('.').pop()}`;
    const { error } = await supabaseClient.storage.from('playlist-covers').upload(imgName, newPlaylistImgFile);
    if(!error) coverUrl = supabaseClient.storage.from('playlist-covers').getPublicUrl(imgName).data.publicUrl;
  }

  const { data } = await supabaseClient.from('playlists').insert({ id, name, description: desc, cover_url: coverUrl }).select().single();
  if (data) {
    state.playlists.push(data);
    closeModal('playlistModal');
    renderAll();
  }
}

/* ─── AUDIO PLAYER ─── */
function playList(list, index) {
  state.queue = list;
  state.queueIndex = index;
  const track = list[index];
  if(track) loadTrack(track.id);
}

function loadTrack(id) {
  const track = state.tracks.find(t => t.id === id);
  if(!track) return;
  state.currentTrackId = id;
  audio.src = track.audio_url;
  
  document.getElementById('nowTitle').textContent = track.title;
  document.getElementById('nowArtist').textContent = track.artist || 'Okänd';
  if(track.cover_url) document.getElementById('nowThumb').innerHTML = `<img src="${track.cover_url}">`;
  else document.getElementById('nowThumb').innerHTML = '🎵';

  audio.play();
  state.isPlaying = true;
  updatePlayButton();
  renderAll();
}

function togglePlay() {
  if(!state.currentTrackId && state.tracks.length > 0) return playList(state.tracks, 0);
  if(state.isPlaying) { audio.pause(); state.isPlaying = false; }
  else { audio.play(); state.isPlaying = true; }
  updatePlayButton();
}

function updatePlayButton() {
  document.getElementById('playIcon').innerHTML = state.isPlaying 
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
    : '<path d="M8 5v14l11-7z"/>';
}

function nextTrack() {
  if(state.queue.length === 0) return;
  state.queueIndex = (state.queueIndex + 1) % state.queue.length;
  loadTrack(state.queue[state.queueIndex].id);
}

function prevTrack() {
  if(state.queue.length === 0) return;
  state.queueIndex = (state.queueIndex - 1 + state.queue.length) % state.queue.length;
  loadTrack(state.queue[state.queueIndex].id);
}

function toggleRepeat() {
  if (state.repeat === 'none') {
    state.repeat = 'one';
    document.getElementById('repeatBtn').style.color = 'var(--green)';
  } else {
    state.repeat = 'none';
    document.getElementById('repeatBtn').style.color = 'var(--muted)';
  }
}

function setupAudioListeners() {
  audio.ontimeupdate = () => {
    const fill = document.getElementById('progressFill');
    const cur = document.getElementById('currentTime');
    const tot = document.getElementById('totalTime');
    if(fill) fill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
    if(cur) cur.textContent = formatTime(audio.currentTime);
    if(tot) tot.textContent = formatTime(audio.duration);
  };
  
  audio.onended = () => {
    if (state.repeat === 'one') {
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  };
}

function seekTo(e) {
  const bar = document.getElementById('progressBar');
  const pct = e.offsetX / bar.offsetWidth;
  audio.currentTime = pct * audio.duration;
}

function setVolume(e) {
  const bar = document.getElementById('volumeBar');
  const pct = e.offsetX / bar.offsetWidth;
  state.volume = pct;
  audio.volume = pct;
  document.getElementById('volumeFill').style.width = (pct * 100) + '%';
}

/* ─── CONTEXT SYSTEM ─── */
function openContextMenu(e, id, type = 'track') {
  e.preventDefault();
  ctxTrackId = id;
  ctxType = type;
  
  const menu = document.getElementById('contextMenu');
  const playOpt = document.getElementById('ctxPlayOpt');
  
  if (type === 'playlist') {
    playOpt.style.display = 'none';
  } else {
    playOpt.style.display = 'block';
  }
  
  menu.style.top = e.clientY + 'px';
  menu.style.left = e.clientX + 'px';
  menu.classList.add('open');
  setTimeout(() => document.addEventListener('click', closeContextMenu), 10);
}

function closeContextMenu() { document.getElementById('contextMenu').classList.remove('open'); document.removeEventListener('click', closeContextMenu); }

function ctxPlay() { if(ctxType === 'track' && ctxTrackId) loadTrack(ctxTrackId); }

function ctxEdit() {
  if (ctxType === 'track') {
    const track = state.tracks.find(t => t.id === ctxTrackId);
    if(!track) return;
    editingTrackId = track.id;
    editingTrackNewImg = null;
    document.getElementById('editTrackName').value = track.title;
    document.getElementById('editTrackArtist').value = track.artist;
    if(track.cover_url) {
      document.getElementById('editTrackImgPreview').src = track.cover_url;
      document.getElementById('editTrackImgPreview').style.display = 'block';
      document.getElementById('editTrackImgPlaceholder').style.display = 'none';
    } else {
      document.getElementById('editTrackImgPreview').style.display = 'none';
      document.getElementById('editTrackImgPlaceholder').style.display = 'block';
    }
    document.getElementById('editTrackModal').classList.add('open');
  } else {
    const pl = state.playlists.find(p => p.id === ctxTrackId);
    if(!pl) return;
    editingPlaylistId = pl.id;
    editingPlaylistNewImg = null;
    document.getElementById('editPlaylistName').value = pl.name;
    document.getElementById('editPlaylistDesc').value = pl.description || '';
    if(pl.cover_url) {
      document.getElementById('editPlaylistImgPreview').src = pl.cover_url;
      document.getElementById('editPlaylistImgPreview').style.display = 'block';
      document.getElementById('editPlaylistImgPlaceholder').style.display = 'none';
    } else {
      document.getElementById('editPlaylistImgPreview').style.display = 'none';
      document.getElementById('editPlaylistImgPlaceholder').style.display = 'block';
    }
    document.getElementById('editPlaylistModal').classList.add('open');
  }
}

function handleEditTrackImg(input) {
  if (input.files && input.files[0]) {
    editingTrackNewImg = input.files[0];
    document.getElementById('editTrackImgPreview').src = URL.createObjectURL(editingTrackNewImg);
    document.getElementById('editTrackImgPreview').style.display = 'block';
    document.getElementById('editTrackImgPlaceholder').style.display = 'none';
  }
}

async function confirmEditTrack() {
  const title = document.getElementById('editTrackName').value.trim();
  const artist = document.getElementById('editTrackArtist').value.trim();
  let coverUrl = state.tracks.find(t => t.id === editingTrackId).cover_url;

  if (editingTrackNewImg) {
    const imgName = `${editingTrackId}_editcover.${editingTrackNewImg.name.split('.').pop()}`;
    await supabaseClient.storage.from('track-covers').upload(imgName, editingTrackNewImg, { upsert: true });
    coverUrl = supabaseClient.storage.from('track-covers').getPublicUrl(imgName).data.publicUrl;
  }

  await supabaseClient.from('tracks').update({ title, artist, cover_url: coverUrl }).eq('id', editingTrackId);
  const idx = state.tracks.findIndex(t => t.id === editingTrackId);
  if(idx !== -1) { state.tracks[idx].title = title; state.tracks[idx].artist = artist; state.tracks[idx].cover_url = coverUrl; }
  
  closeModal('editTrackModal');
  renderAll();
}

function handleEditPlaylistImg(input) {
  if (input.files && input.files[0]) {
    editingPlaylistNewImg = input.files[0];
    document.getElementById('editPlaylistImgPreview').src = URL.createObjectURL(editingPlaylistNewImg);
    document.getElementById('editPlaylistImgPreview').style.display = 'block';
    document.getElementById('editPlaylistImgPlaceholder').style.display = 'none';
  }
}

async function confirmEditPlaylist() {
  const name = document.getElementById('editPlaylistName').value.trim();
  const description = document.getElementById('editPlaylistDesc').value.trim();
  if(!name) return;
  
  let coverUrl = state.playlists.find(p => p.id === editingPlaylistId).cover_url;

  if (editingPlaylistNewImg) {
    const imgName = `${editingPlaylistId}_editpcover.${editingPlaylistNewImg.name.split('.').pop()}`;
    await supabaseClient.storage.from('playlist-covers').upload(imgName, editingPlaylistNewImg, { upsert: true });
    coverUrl = supabaseClient.storage.from('playlist-covers').getPublicUrl(imgName).data.publicUrl;
  }

  await supabaseClient.from('playlists').update({ name, description, cover_url: coverUrl }).eq('id', editingPlaylistId);
  
  const idx = state.playlists.findIndex(p => p.id === editingPlaylistId);
  if(idx !== -1) { 
    state.playlists[idx].name = name; 
    state.playlists[idx].description = description; 
    state.playlists[idx].cover_url = coverUrl; 
  }
  
  closeModal('editPlaylistModal');
  renderAll();
}

async function ctxDelete() {
  if(!ctxTrackId) return;
  
  if (ctxType === 'track') {
    await supabaseClient.from('tracks').delete().eq('id', ctxTrackId);
    state.tracks = state.tracks.filter(t => t.id !== ctxTrackId);
  } else {
    await supabaseClient.from('playlists').delete().eq('id', ctxTrackId);
    state.playlists = state.playlists.filter(p => p.id !== ctxTrackId);
    
    if(state.currentPlaylistId === ctxTrackId) {
      state.view = 'home';
      state.currentPlaylistId = null;
    }
  }
  renderAll();
}
</script>
