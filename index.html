<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprotify – Din Musik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap');

  :root {
    --green: #1db954;
    --green-dark: #17a349;
    --bg: #0c0c0e;
    --sidebar: #000000;
    --navbar: #111114;
    --card: #18181c;
    --card-hover: #26262b;
    --text: #ffffff;
    --muted: #a7a7a7;
    --border: #1f1f23;
    --player-bg: #111114;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 60px 1fr 90px;
    overflow: hidden;
    user-select: none;
  }

  /* TOP NAVBAR (Enligt din skiss) */
  .navbar {
    grid-column: 1 / -1;
    grid-row: 1;
    background: var(--navbar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .logo-text {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -1px;
    background: linear-gradient(45deg, #fff, var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .logo-text:hover { transform: scale(1.05); }

  .nav-menu-links {
    display: flex;
    gap: 24px;
  }

  .menu-link {
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s ease, transform 0.2s ease;
    text-transform: capitalize;
  }
  .menu-link:hover, .menu-link.active {
    color: var(--text);
    transform: translateY(-1px);
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--sidebar);
    grid-column: 1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    padding: 20px 12px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }

  .sidebar-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }
  .sidebar-btn:hover {
    color: var(--text);
    background: var(--card-hover);
  }
  .sidebar-btn.active {
    background: #202024;
    color: var(--green);
  }
  .sidebar-btn svg { width: 20px; height: 20px; }

  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 16px 16px 8px;
  }

  .playlist-list { flex: 1; overflow-y: auto; margin-top: 8px; }
  .playlist-item {
    padding: 10px 16px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13.5px;
    border-radius: 6px;
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-item:hover { color: var(--text); background: var(--card-hover); padding-left: 20px; }
  .playlist-item.active { color: #inner; background: var(--border); color: var(--text); }

  /* MAIN CONTENT AREA */
  .main {
    grid-column: 2;
    grid-row: 2;
    overflow-y: auto;
    background: linear-gradient(180deg, #16161a 0%, var(--bg) 400px);
    padding: 32px;
    position: relative;
  }

  .view-header {
    margin-bottom: 28px;
    animation: fadeIn 0.4s ease forwards;
  }
  .view-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }

  .upload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--text);
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .upload-btn:hover { transform: scale(1.04); background: var(--green); color: #fff; }

  /* CARDS GRID & CARDS WITH ANIMATION */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 24px;
    animation: fadeInUp 0.5s ease forwards;
  }

  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
    position: relative;
  }
  .card:hover {
    background: var(--card-hover);
    transform: translateY(-6px);
    border-color: #303035;
    box-shadow: 0 12px 24px rgba(0,0,0,0.3);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    background: linear-gradient(135deg, #2b2b36, #111115);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }

  .card-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* TRACK LIST TABLE */
  .track-list-header {
    display: grid;
    grid-template-columns: 50px 1fr 160px 80px;
    padding: 0 16px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .track-row {
    display: grid;
    grid-template-columns: 50px 1fr 160px 80px;
    padding: 8px 16px;
    border-radius: 8px;
    align-items: center;
    cursor: pointer;
    transition: background 0.2s ease;
    position: relative;
  }
  .track-row:hover { background: var(--card-hover); }
  .track-row.playing { color: var(--green); }

  .track-num { text-align: center; color: var(--muted); font-size: 14px; }
  .track-info { display: flex; align-items: center; gap: 14px; }
  
  .track-thumb {
    width: 44px; height: 44px; border-radius: 6px;
    background: #25252b; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--muted);
  }
  .track-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .track-name { font-size: 14.5px; font-weight: 500; }
  .track-artist { font-size: 12.5px; color: var(--muted); }

  /* PLAYER BAR */
  .player {
    grid-column: 1 / -1;
    grid-row: 3;
    background: var(--player-bg);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 300px 1fr 300px;
    align-items: center;
    padding: 0 24px;
    z-index: 20;
  }

  .now-playing { display: flex; align-items: center; gap: 14px; }
  .now-thumb {
    width: 56px; height: 56px; border-radius: 6px;
    background: #222226; flex-shrink: 0;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .now-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .player-controls { display: flex; align-items: center; gap: 20px; }
  
  .play-pause-btn {
    width: 40px; height: 40px; background: #fff; border: none; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #000; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .play-pause-btn:hover { transform: scale(1.1); background: var(--green); color: #fff; }

  .progress-bar-area { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 550px; }
  .progress-bar { flex: 1; height: 4px; background: #333; border-radius: 2px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 2px; width: 0%; }

  .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .volume-bar { width: 90px; height: 4px; background: #333; border-radius: 2px; cursor: pointer; }
  .volume-fill { height: 100%; background: var(--muted); border-radius: 2px; width: 80%; }

  /* MODALS (UPDATED WITH IMAGE UPLOADS + CUSTOM DETAILS) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  
  .modal {
    background: #19191d; border-radius: 16px; padding: 32px;
    width: 460px; max-width: 95vw; transform: scale(0.92);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 1px solid #2c2c32;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal h2 { font-size: 22px; margin-bottom: 20px; font-weight: 700; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  
  .modal input[type="text"], .modal textarea {
    width: 100%; background: #25252b; border: 1px solid #32323a;
    border-radius: 8px; color: var(--text); font-family: inherit;
    font-size: 14.5px; padding: 12px 16px; outline: none; transition: border 0.2s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--green); }
  
  .image-preview-box {
    width: 100%; height: 140px; background: #25252b; border: 2px dashed #3a3a45;
    border-radius: 8px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; overflow: hidden; margin-bottom: 16px;
    transition: all 0.2s ease; color: var(--muted);
  }
  .image-preview-box:hover { border-color: var(--green); color: var(--text); }
  .image-preview-box img { width: 100%; height: 100%; object-fit: cover; }
  .image-preview-box p { font-size: 13px; margin-top: 4px; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  
  .btn-cancel {
    background: transparent; border: 1px solid #444; color: var(--text);
    padding: 10px 24px; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 13.5px;
  }
  .btn-confirm {
    background: var(--green); color: #000; border: none; padding: 10px 24px;
    border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 700;
  }
  .btn-confirm:hover { background: var(--green-dark); color: #fff; }

  /* KEYFRAMES */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header class="navbar">
  <div class="nav-left">
    <div class="logo-text" onclick="showView('home')">Sprotify</div>
    <div class="nav-menu-links">
      <div class="menu-link active" id="link-home" onclick="showView('home')">hem</div>
      <div class="menu-link" id="link-library" onclick="showView('library')">spellistor</div>
    </div>
  </div>
  <button class="upload-btn" onclick="openUpload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
    ladda upp
  </button>
</header>

<aside class="sidebar">
  <button class="sidebar-btn active" id="side-home" onclick="showView('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Hem
  </button>
  <button class="sidebar-btn" id="side-library" onclick="showView('library')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg> Bibliotek
  </button>

  <div class="sidebar-title">Mina Spellistor</div>
  <button class="sidebar-btn" style="border: 1px dashed #333; margin-bottom: 8px;" onclick="openNewPlaylist()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Ny spellista
  </button>
  <div class="playlist-list" id="playlistList"></div>
</aside>

<main class="main" id="mainContent">
  <div class="view-header">
    <div class="view-title" id="viewTitle">Hem</div>
  </div>
  <div id="contentArea"></div>
</main>

<footer class="player">
  <div class="now-playing">
    <div class="now-thumb" id="nowThumb">🎵</div>
    <div>
      <div class="now-title" id="nowTitle">Ingen låt vald</div>
      <div class="now-artist" id="nowArtist">–</div>
    </div>
  </div>

  <div class="player-center">
    <div class="player-controls">
      <button class="play-pause-btn" onclick="togglePlay()" id="playPauseBtn">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="progress-bar-area">
      <span id="currentTime" style="font-size:11px; color:var(--muted)">0:00</span>
      <div class="progress-bar" onclick="seekTo(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="totalTime" style="font-size:11px; color:var(--muted)">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <span style="font-size:16px; color:var(--muted)">🔊</span>
    <div class="volume-bar" onclick="setVolume(event)">
      <div class="volume-fill" id="volumeFill"></div>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h2>Ladda upp ny låt</h2>
    
    <div class="form-group">
      <label>Välj Ljudfil</label>
      <input type="file" id="fileInput" accept="audio/*" onchange="handleAudioFile(this.files)">
    </div>

    <div class="form-group">
      <label>Låtens namn</label>
      <input type="text" id="trackNameInput" placeholder="Ex: My Super Song">
    </div>

    <div class="form-group">
      <label>Artist / Skapare</label>
      <input type="text" id="trackArtistInput" placeholder="Ex: DJ Sprotify">
    </div>

    <div class="form-group">
      <label>Omslagsbild (Valfritt)</label>
      <div class="image-preview-box" onclick="document.getElementById('trackImageInput').click()">
        <div id="trackImgPreviewArea" style="text-align:center;">
          <span>📸 Klicka för att välja bild</span>
        </div>
        <input type="file" id="trackImageInput" accept="image/*" style="display:none" onchange="previewImage(this, 'trackImgPreviewArea')">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('uploadModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmUpload()">Spara & Ladda upp</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="playlistModal">
  <div class="modal">
    <h2>Skapa ny spellista</h2>
    
    <div class="form-group">
      <label>Spellistans namn</label>
      <input type="text" id="playlistName" placeholder="Ex: Sommarhits 2026">
    </div>

    <div class="form-group">
      <label>Beskrivning</label>
      <textarea id="playlistDesc" placeholder="Vad innehåller den här listan?" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label>Spellistans omslagsbild</label>
      <div class="image-preview-box" onclick="document.getElementById('playlistImageInput').click()">
        <div id="playlistImgPreviewArea" style="text-align:center;">
          <span>📸 Klicka för att välja bild</span>
        </div>
        <input type="file" id="playlistImageInput" accept="image/*" style="display:none" onchange="previewImage(this, 'playlistImgPreviewArea')">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('playlistModal')">Avbryt</button>
      <button class="btn-confirm" onclick="confirmNewPlaylist()">Skapa</button>
    </div>
  </div>
</div>

<audio id="audioPlayer"></audio>

<script>
// Supabase-konfiguration hängs kvar från din originalkod
const supabaseUrl = "https://zsgvkgiakfadrlhfjhjv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZ3ZrZ2lha2ZhZHJsaGZqaGp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMzE2NTUsImV4cCI6MjA5NTkwNzY1NX0.etPjB4_FrMQqRxfOPOrHmqpLyMYla3rO_xBVt-c0FFM";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let state = {
  tracks: [],
  playlists: [],
  currentTrackId: null,
  currentPlaylistId: null,
  isPlaying: false,
  volume: 0.8,
  view: 'home'
};

let uploadedAudioBase64 = "";
let uploadedImageBase64 = "";
let uploadedPlaylistImageBase64 = "";

const audio = document.getElementById('audioPlayer');

async function load() {
  try {
    const { data: playlistsData } = await supabaseClient.from('playlists').select('*');
    state.playlists = playlistsData || [];
    const { data: tracksData } = await supabaseClient.from('tracks').select('*');
    state.tracks = tracksData || [];
    renderAll();
  } catch(e) { console.log(e); }
}

function showView(view, playlistId) {
  state.view = view;
  state.currentPlaylistId = playlistId || null;
  
  // Uppdatera nav-aktiva länkar och sidebars samtidigt
  document.querySelectorAll('.menu-link, .sidebar-btn').forEach(el => el.classList.remove('active'));
  
  if (view === 'home') {
    document.getElementById('link-home').classList.add('active');
    document.getElementById('side-home').classList.add('active');
    document.getElementById('viewTitle').textContent = 'Hem';
  } else if (view === 'library') {
    document.getElementById('link-library').classList.add('active');
    document.getElementById('side-library').classList.add('active');
    document.getElementById('viewTitle').textContent = 'Spellistor & Bibliotek';
  }
  renderMain();
}

function renderAll() {
  renderPlaylistSidebar();
  renderMain();
}

function renderPlaylistSidebar() {
  const el = document.getElementById('playlistList');
  el.innerHTML = '';
  state.playlists.forEach(p => {
    const div = document.createElement('div');
    div.className = 'playlist-item' + (state.currentPlaylistId === p.id ? ' active' : '');
    div.textContent = p.name;
    div.onclick = () => showView('playlist', p.id);
    el.appendChild(div);
  });
}

function renderMain() {
  const contentArea = document.getElementById('contentArea');
  contentArea.innerHTML = '';

  if (state.view === 'home') {
    // Rendera låtar i snygga kort på hemvyn
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    
    if(state.tracks.length === 0) {
      contentArea.innerHTML = "<p style='color:var(--muted)'>Inga låtar tillgängliga. Ladda upp musik vetja!</p>";
      return;
    }

    state.tracks.forEach(track => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => playTrack(track.id);
      
      const imgContent = track.image_url ? `<img src="${track.image_url}">` : '🎵';
      card.innerHTML = `
        <div class="card-img">${imgContent}</div>
        <div class="card-name">${track.name}</div>
        <div class="card-sub">${track.artist || 'Okänd artist'}</div>
      `;
      grid.appendChild(card);
    });
    contentArea.appendChild(grid);
  } 
  
  else if (state.view === 'library') {
    // Rendera spellistor i kortformat
    const grid = document.createElement('div');
    grid.className = 'card-grid';

    if(state.playlists.length === 0) {
      contentArea.innerHTML = "<p style='color:var(--muted)'>Du har inte skapat några spellistor än.</p>";
      return;
    }

    state.playlists.forEach(pl => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => showView('playlist', pl.id);
      
      const imgContent = pl.image_url ? `<img src="${pl.image_url}">` : '🎼';
      card.innerHTML = `
        <div class="card-img">${imgContent}</div>
        <div class="card-name">${pl.name}</div>
        <div class="card-sub">${pl.desc || 'Spellista'}</div>
      `;
      grid.appendChild(card);
    });
    contentArea.appendChild(grid);
  }

  else if (state.view === 'playlist' && state.currentPlaylistId) {
    const pl = state.playlists.find(p => p.id === state.currentPlaylistId);
    if(!pl) return;
    
    document.getElementById('viewTitle').textContent = pl.name;
    
    const trackListContainer = document.createElement('div');
    trackListContainer.innerHTML = `
      <div class="track-list-header"><span>#</span><span>Titel</span><span>Artist</span><span></span></div>
    `;

    state.tracks.forEach((track, index) => {
      const row = document.createElement('div');
      row.className = 'track-row';
      row.onclick = () => playTrack(track.id);
      
      const thumb = track.image_url ? `<img src="${track.image_url}">` : '🎵';
      row.innerHTML = `
        <div class="track-num">${index + 1}</div>
        <div class="track-info">
          <div class="track-thumb">${thumb}</div>
          <div class="track-name">${track.name}</div>
        </div>
        <div class="track-artist">${track.artist || 'Okänd'}</div>
        <div>▶</div>
      `;
      trackListContainer.appendChild(row);
    });
    contentArea.appendChild(trackListContainer);
  }
}

// BILD-FÖRHANDSGRANSKNING & CONVERT TILL BASE64
function previewImage(input, previewAreaId) {
  const file = input.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById(previewAreaId).innerHTML = `<img src="${e.target.result}">`;
      if(previewAreaId === 'trackImgPreviewArea') {
        uploadedImageBase64 = e.target.result;
      } else {
        uploadedPlaylistImageBase64 = e.target.result;
      }
    }
    reader.readAsDataURL(file);
  }
}

function handleAudioFile(files) {
  const file = files[0];
  if(file) {
    // Fyller i filnamnet automatiskt som förslag på låttitel
    document.getElementById('trackNameInput').value = file.name.replace(/\.[^/.]+$/, "");
    const reader = new FileReader();
    reader.onload = function(e) {
      uploadedAudioBase64 = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

// MODAL STYRNING
function openUpload() { document.getElementById('uploadModal').classList.add('open'); }
function openNewPlaylist() { document.getElementById('playlistModal').classList.add('open'); }
function closeModal(id) { 
  document.getElementById(id).classList.remove('open'); 
  // Rensa temporär data
  uploadedImageBase64 = ""; uploadedAudioBase64 = ""; uploadedPlaylistImageBase64 = "";
}

// SPARA DATA I SUPABASE
async function confirmUpload() {
  const name = document.getElementById('trackNameInput').value || 'Namnlös låt';
  const artist = document.getElementById('trackArtistInput').value || 'Okänd artist';
  
  if(!uploadedAudioBase64) { alert("Du måste välja en ljudfil först!"); return; }

  // Vi sparar Base64-strängen direkt i fälten image_url samt url för enkelhetens skull i den här versionen
  const newTrack = {
    name: name,
    artist: artist,
    url: uploadedAudioBase64,
    image_url: uploadedImageBase64 || null
  };

  await supabaseClient.from('tracks').insert([newTrack]);
  closeModal('uploadModal');
  load();
}

async function confirmNewPlaylist() {
  const name = document.getElementById('playlistName').value || 'Min Spellista';
  const desc = document.getElementById('playlistDesc').value || '';

  const newPlaylist = {
    name: name,
    desc: desc,
    image_url: uploadedPlaylistImageBase64 || null
  };

  await supabaseClient.from('playlists').insert([newPlaylist]);
  closeModal('playlistModal');
  load();
}

// SPELAREKONTROLLER
function playTrack(id) {
  const track = state.tracks.find(t => t.id === id);
  if(!track) return;
  
  state.currentTrackId = id;
  audio.src = track.url;
  audio.play();
  state.isPlaying = true;
  
  document.getElementById('nowTitle').textContent = track.name;
  document.getElementById('nowArtist').textContent = track.artist;
  document.getElementById('nowThumb').innerHTML = track.image_url ? `<img src="${track.image_url}">` : '🎵';
  document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Paussymbol
}

function togglePlay() {
  if(!state.currentTrackId) return;
  if(audio.paused) {
    audio.play();
    document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    audio.pause();
    document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>'; // Spelasymbol
  }
}

// Uppdatera tidslinje under uppspelning
audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  document.getElementById('progressFill').style.width = pct + '%';
  
  const minutesCurrent = Math.floor(audio.currentTime / 60);
  const secondsCurrent = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
  document.getElementById('currentTime').textContent = `${minutesCurrent}:${secondsCurrent}`;
  
  if(audio.duration) {
    const minutesTotal = Math.floor(audio.duration / 60);
    const secondsTotal = Math.floor(audio.duration % 60).toString().padStart(2, '0');
    document.getElementById('totalTime').textContent = `${minutesTotal}:${secondsTotal}`;
  }
});

function seekTo(e) {
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  audio.currentTime = pct * audio.duration;
}

function setVolume(e) {
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  audio.volume = pct;
  document.getElementById('volumeFill').style.width = (pct * 100) + '%';
}

window.onload = load;
</script>
